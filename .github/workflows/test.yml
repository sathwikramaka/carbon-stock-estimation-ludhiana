name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      # Tests that need results/carbon_cells.csv (git-ignored, 22 MB) skip
      # cleanly; everything else, including the raw-export checks, runs.
      - name: Run pytest
        run: pytest tests/ -v
